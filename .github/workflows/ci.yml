name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    # Phase H: run inside the runex-ci image so the shell tools the
    # test suite reaches for (bash 4+, zsh, pwsh, nu, xclip,
    # wl-paste, xsel) are pinned and reproducible. The image is
    # built / pushed by .github/workflows/build-ci-image.yml; the
    # digest below is copied from that workflow's Step Summary.
    # Bumping the digest is a deliberate one-line commit so a
    # rebuilt image cannot silently change the CI gate.
    container:
      image: ghcr.io/shortarrow/runex-ci@sha256:0690174dd710f346726779da0c87a5c39eb9bd4d8111b71d87266b0c10b4c6e1
      options: --user 1001
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # No dtolnay/rust-toolchain — the image already ships rustup
      # default stable + clippy + rustfmt. No `apt-get install zsh`
      # — that's now baked in.
      - name: Verify image tooling
        run: which bash zsh pwsh nu xclip wl-paste xsel cargo rustc
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  linux-binary-portability:
    name: Linux binary (${{ matrix.target }})
    # The release binaries must start on the oldest distributions we
    # support, whatever glibc the runner image ships. Each target is
    # built natively, packaged as the release packages it, and installed
    # and run in those distributions' containers by install-test.sh. A
    # loader warning on stderr fails too: the shell hook runs runex on
    # every key press.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # the release.yml action; installs the current stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Install apt-ftparchive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
      - name: Package, install and run on the oldest supported distributions
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' runex/Cargo.toml | head -n 1)"
          sh packaging/apt/build-deb.sh "target/$TARGET/release/runex" "$version" "$ARCH" deb
          sh packaging/apt/install-test.sh deb "$version" "$ARCH"

  deb-scripts:
    name: Debian package scripts
    # The release workflow only runs on a tag, so the scripts it builds
    # the Debian package with are exercised here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: bash packaging/apt/test-build-deb.sh

  homebrew-script:
    name: Homebrew release script
    # release.sh runs by hand after a release, so it is exercised here
    # against stand-in assets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: bash packaging/homebrew/test-release.sh

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  clippy:
    name: Clippy (${{ matrix.os }})
    # Separate from the test jobs so every OS lints with the same
    # stable clippy (the Linux test image carries an older toolchain,
    # and lints differ between versions). Each OS compiles a different
    # set of `cfg` blocks, so all three run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
